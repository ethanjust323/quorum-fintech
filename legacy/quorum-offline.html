<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Quorum classroom prototype. Collect together. Move forward together. Simulated conditional group payments."><title>Quorum · Group payments, with certainty</title><style>:root{--ink:#182e2b;--muted:#6e7c76;--green:#185d4a;--light:#edf2e9;--line:#e1e6dd;--paper:#f8f9f4;--orange:#c77542;--white:#fff;--radius:18px}*{box-sizing:border-box}body{margin:0;font:14px/1.55 Inter,Arial,sans-serif;color:var(--ink);background:var(--paper)}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.48}a{color:inherit}h1,h2,h3,p{margin:0}h1{font:normal 46px/1.12 Georgia,serif;letter-spacing:-1.4px}h2{font-size:19px;letter-spacing:-.4px}h3{font-size:14px}.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.side{padding:32px 22px;border-right:1px solid var(--line);background:#f0f3eb;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:10px;font-size:27px;letter-spacing:-1px;font-weight:700}.mark{display:grid;grid-template-columns:repeat(2,8px);gap:3px;transform:rotate(-10deg);padding:9px}.mark i{height:8px;background:var(--green);border-radius:2px}.mark i:last-child{opacity:.35}.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:10px;font-weight:700;color:var(--muted)}nav{display:grid;gap:8px}nav button{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:10px;background:none;padding:12px;color:var(--muted)}nav button.active{background:#dfe9da;color:var(--green);font-weight:700}.side-note{margin-top:auto;padding-top:28px;font-size:12px;color:var(--muted)}.side-note strong{display:block;color:var(--ink);margin-bottom:7px}.top{height:76px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 42px;background:#fcf ily:Georgia,serif}.pool-header{display:flex;gap:13px;align-items:center}.muted{color:var(--muted)}.tiny{font-size:11px}.progress{height:8px;border-radius:30px;background:#eaf0e5;overflow:hidden;margin:14px 0 9px}.progress div{height:100%;background:var(--green);border-radius:30px;transition:width .4s}.progress-row{display:flex;justify-content:space-between;font-size:12px}.pool-money{font-size:29px;letter-spacing:-1px;margin-top:23px}.pool-money span{font-size:14px;color:var(--muted);letter-spacing:0}.divider{border-top:1px solid var(--line);margin:22px 0}.member{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #f0f2ec;gap:10px}.member:last-child{border:0}.member-name{display:flex;align-items:center;gap:10px}.member .avatar{width:31px;height:31px;font-size:10px}.member-right{text-align:right;font-size:12px}.check{color:var(--green);font-size:11px}.await{color:#9b7b53;font-size:11px}.info-strip{background:#f4f6ef;border-radius:10px;padding:13px 15px;font-size:12px;margin-top:20px;display:flex;gap:10px}.fact{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #edf0e9;font-size:12px}.fact:last-child{border:0}.fact span:first-child{color:var(--muted)}.fact span:last-child{text-align:right;font-weight:600}.side-card{margin-bottom:19px}.label{display:block;font-size:12px;font-weight:600;margin-bottom:7px}select,input{width:100%;padding:11px 12px;border:1px solid #d9e0d4;border-radius:8px;background:white;color:var(--ink)}.full{width:100%}.action-space{margin-top:13px}.overline{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}.demo-banner{border:1px dashed #d2daca;border-radius:11px;padding:15px;margin-top:20px;font-size:11px;color:var(--muted)}.demo-banner strong{color:var(--ink)}.events{display:grid;gap:17px}.event{display:flex;gap:12px}.event-dot{width:9px;height:9px;border-radius:50%;background:#b4c5a9;margin-top:5px;flex:none}.event small{font-size:10px;color:var(--muted)}.event p{font-size:12px}.event-amount{margin-left:auto;white-space:nowrap;font-weight:600;font-size:12px}.list-card{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:16px;padding:23px;color:var(--ink);transition:transform .15s,box-shadow .15s}.list-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px #1834260b}.pools-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.list-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:17px;margin-top:21px;font-size:11px;color:var(--muted)}.welcome{padding:25px 28px;background:#e9efdf;border-radius:15px;margin:0 0 27px;display:flex;align-items:center;justify-content:space-between;gap:20px}.welcome h2{font-family:Georgia,serif;font-size:24px;font-weight:400}.welcome p{font-size:12px;color:#63715d;margin-top:6px}.footer{margin-top:30px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;gap:20px}.footer a{text-decoration:none}.modal-wrap{position:fixed;inset:0;background:#152d2690;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px)}.modal{background:var(--paper);border-radius:20px;padding:30px;width:520px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 90px #0003}.modal h2{font:normal 30px Georgia,serif;margin-bottom:9px}.modal .subtitle{font-size:12px;margin:0 0 22px}.field{margin:16px 0}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.error{font-size:12px;color:#a33c2c;margin-top:12px}.checkbox{display:flex;gap:10px;font-size:12px;margin-top:20px}.checkbox input{width:16px;flex:none;margin-top:3px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 23px;border-radius:11px;z-index:40;box-shadow:0 10px 30px #0002;font-size:13px;max-width:90vw}.steps{counter-reset:step;display:grid;gap:23px;margin-top:25px}.step{display:flex;gap:15px}.step:before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:50%;background:#e2ebdb;color:var(--green);font-weight:600}.step p{color:var(--muted);font-size:12px;margin-top:4px}.badge{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:3px 7px;border-radius:5px}.success-heading{font:normal 29px Georgia,serif;margin:8px 0}.notice{padding:16px;border-radius:11px;background:#edf5ed;color:#295d3c;font-size:12px;margin-bottom:22px}.notice.expired{background:#fbf0e3;color:#8a552d}.spacer{margin-top:22px}svg{vertical-align:middle}button .icon{width:16px;height:16px}body.modal-open{overflow:hidden}@media(min-width:1500px){.workspace{padding-top:48px}}@media(max-width:1050px){.shell{grid-template-columns:190px 1fr}.side{padding:28px 15px}.workspace{padding:30px 25px}.top{padding:0 25px}.grid{grid-template-columns:1fr}.pools-grid{grid-template-columns:1fr}h1{font-size:38px}}@media(max-width:650px){.shell{display:block}.side{padding:16px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:22px}.side .eyebrow,.side-note{display:none}nav{display:flex;gap:1px}nav button{padding:8px;font-size:11px}nav button svg{display:none}.top{height:56px;padding:0 19px;font-size:11px}.top-right{gap:9px}.top-right>span{display:none}.workspace{padding:27px 18px}.heading{align-items:flex-start;gap:12px}h1{font-size:34px}.subtitle{font-size:12px}.stats{gap:8px}.stat{padding:13px 11px}.stat-label{font-size:10px}.stat-value{font-size:23px}.stat small{font-size:9px}.card-pad{padding:20px}.welcome{padding:20px;display:block}.welcome .btn{margin-top:15px}.heading .btn{white-space:nowrap;padding:9px 11px}.form-row{grid-template-columns:1fr}.modal{padding:23px}.footer{display:block}.footer span{display:block;margin-top:6px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>quorum<span style="color:#8ea77b">.</span></div><div><p class="eyebrow" style="margin-bottom:13px;padding-left:12px">Your workspace</p><nav><button id="nav-pools" onclick="App.home()">▦ <span>Group pools</span></button><button id="nav-guide" onclick="App.guide()">◷ <span>Demo guide</span></button></nav></div><div class="side-note"><strong>A little certainty.<br>A lot less chasing.</strong>Everyone contributes.<br>Everyone knows the rules.<div class="divider"></div>FinTech classroom prototype<br>Quorum team · BFIN 4260</div></aside><div><header class="top"><span id="breadcrumb">Workspace / Group pools</span><div class="top-right"><span class="pill">Demo mode</span><span class="tiny muted">No real money moves</span><div class="avatar">Q</div></div></header><main class="workspace" id="main"></main></div></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><script>(function(root){
'use strict';
const money=n=>Math.round(n*100);
function create({title,recipient,total,names,deadline},now=Date.now()){
 if(!title?.trim()||!recipient?.trim())throw Error('Enter a name and recipient.');
 const cents=money(Number(total));
 if(!Number.isFinite(cents)||cents<100||cents>100000000)throw Error('Total must be between $1 and $1,000,000.');
 if(!Array.isArray(names)||names.length<2||names.length>10||names.some(n=>!n.trim()))throw Error('Add 2–10 participant names.');
 if(new Set(names.map(n=>n.trim().toLowerCase())).size!==names.length)throw Error('Use a different name for each participant.');
 if(!Number.isFinite(deadline)||deadline<=now)throw Error('Choose a future deadline.');
 return {id:'Q-'+Math.random().toString(36).slice(2,8).toUpperCase(),title:title.trim(),recipient:recipient.trim(),total:cents,deadline,created:now,status:'collecting',members:names.map((n,i)=>({name:n.trim(),share:Math.floor(cents/names.length)+(i<cents%names.length?1:0),paid:false,refund:'none'})),events:[{type:'created',amount:0,at:now,text:'Pool created. Terms set for everyone.'}]};
}
function event(p,type,amount,text,now){p.events.push({type,amount,text,at:now});}
function expire(p,now){if(p.status!=='collecting'||now<p.deadline)return false;p.status='expired';p.members.filter(m=>m.paid).forEach(m=>{m.refund='pending';event(p,'refund_pending',m.share,'Refund initiated for '+m.name,now)});event(p,'expired',0,'Deadline passed. Recipient receives nothing.',now);return true;}
function pay(p,index,now=Date.now()){
 expire(p,now);
 if(p.status!=='collecting')throw Error('This pool is closed.');
 const m=p.members[index];if(!m)throw Error('Choose a participant.');if(m.paid)throw Error('This participant has already contributed.');
 m.paid=true;event(p,'collected',m.share,m.name+' contributed. Funds held by simulated partner.',now);
 if(p.members.every(x=>x.paid)){p.status='released';event(p,'released',p.total,'Full amount released to '+p.recipient+' (simulated).',now)}
}
function settle(p,now=Date.now()) {if(p.status!=='expired')throw Error('Only expired pools can have refunds.');p.members.filter(m=>m.refund==='pending').forEach(m=>{m.refund='completed';event(p,'refunded',m.share,'Refund completed for '+m.name+' (simulated).',now)});}
function balances(p){const collected=p.members.reduce((s,m)=>s+(m.paid?m.share:0),0),refunded=p.members.reduce((s,m)=>s+(m.refund==='completed'?m.share:0),0),released=p.status==='released'?p.total:0;return{collected,refunded,released,held:collected-refunded-released};}
root.Quorum={create,pay,expire,settle,balances};
})(typeof module!=='undefined'?module.exports:window);
</script><script>'use strict';
const App=(()=>{
const Q=window.Quorum, KEY='quorum-demo-v1';let selected=null,view='home',activeMember=0,timer,storageOK=true;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n%100?2:0}).format(n/100),date=n=>new Date(n).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),initial=n=>n.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
let data;
try{data=JSON.parse(localStorage.getItem(KEY));if(!data||data.version!==1||!Array.isArray(data.pools))data=null;}catch{data=null;storageOK=false;}
function sample(){const p=Q.create({title:'The weekend getaway',recipient:'Pine Lodge · booking deposit',total:400,names:['Ethan','Colin','Cody','Nicholas'],deadline:Date.now()+86400000*2});return p;}
if(!data)data={version:1,pools:[sample()]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch{storageOK=false;}}
function sync(){let changed=false;for(const p of data.pools)if(Q.expire(p,Date.now()))changed=true;if(changed)save();}
function pool(){return data.pools.find(p=>p.id===selected);}
function toast(t){clearTimeout(timer);$('#toast').innerHTML='<div class="toast">'+esc(t)+'</div>';timer=setTimeout(()=>$('#toast').innerHTML='',4200);}
function label(p){return p.status==='released'?'Released':p.status==='expired'?(p.members.some(m=>m.refund==='pending')?'Refunds pending':'Closed · expired'):'Collecting';}
function pill(p){return '<span class="pill '+p.status+'">'+label(p)+'</span>';}
function footer(){return '<footer class="footer"><span>Simulated funds · Proposed partner custody · No payment credentials collected</span><span>'+(!storageOK?'Storage unavailable. This session may not persist.':'Saved on this browser only. Devices do not sync.')+' · Offline classroom demo</span></footer>';}
function totals(){return data.pools.reduce((a,p)=>{const b=Q.balances(p);a.held+=b.held;a.released+=b.released;a.refunded+=b.refunded;return a},{held:0,released:0,refunded:0});}
function stats(){const t=totals();return '<section class="stats"><div class="stat"><div class="stat-label">Held with demo partner</div><div class="stat-value">'+usd(t.held)+'</div><small>Unavailable to organizers</small></div><div class="stat"><div class="stat-label">Released to recipients</div><div class="stat-value">'+usd(t.released)+'</div><small>Only fully funded pools</small></div><div class="stat"><div class="stat-label">Returned to contributors</div><div class="stat-value">'+usd(t.refunded)+'</div><small>Completed demo refunds</small></div></section>';}
function home(){view='home';selected=null;render();}
function open(id){selected=id;view='pool';activeMember=0;render();}
function guide(){view='guide';render();}
function render(){sync();$('#nav-pools').classList.toggle('active',view!=='guide');$('#nav-guide').classList.toggle('active',view==='guide');$('#breadcrumb').textContent=view==='guide'?'Workspace / Demo guide':view==='pool'?'Group pools / '+(pool()?.title||'Pool'):'Workspace / Group pools';if(view==='guide')return renderGuide();if(view==='pool'&&pool())return renderPool();view='home';$('#main').innerHTML='<div class="heading"><div><p class="eyebrow" style="margin-bottom:10px">A shared plan starts here</p><h1>Good plans. Shared commitment.</h1><p class="subtitle">Collect together. Release only when everyone is in.</p></div><button class="btn primary" onclick="App.create()">＋ Create a pool</button></div>'+stats()+'<section class="welcome"><div><h2>Everyone in, or everyone refunded.</h2><p>Set the terms. Collect each share. Let the rules handle the rest.</p></div><button class="btn ghost" onclick="App.guide()">How the demo works ↗</button></section><div class="card-title"><h2>Your group pools <span class="badge">'+data.pools.length+'</span></h2><span class="tiny muted">Select a pool to manage it</span></div><section class="pools-grid">'+data.pools.map(p=>{const b=Q.balances(p),count=p.members.filter(m=>m.paid).length;return '<button class="list-card" onclick="App.open(\''+p.id+'\')"><div class="card-title"><div class="pool-icon">◈</div>'+pill(p)+'</div><h2>'+esc(p.title)+'</h2><p class="muted tiny" style="margin-top:4px">To '+esc(p.recipient)+'</p><div class="pool-money">'+usd(b.collected)+' <span>of '+usd(p.total)+'</span></div><div class="progress"><div style="width:'+b.collected/p.total*100+'%"></div></div><div class="progress-row"><span>'+count+' of '+p.members.length+' contributed</span><span>'+Math.round(b.collected/p.total*100)+'%</span></div><div class="list-footer"><span>'+date(p.deadline)+'</span><span>View pool →</span></div></button>'}).join('')+'</section>'+footer();}
function renderPool(){const p=pool(),b=Q.balances(p),count=p.members.filter(m=>m.paid).length;activeMember=Math.min(activeMember,p.members.length-1);const m=p.members[activeMember];let notice='';if(p.status==='released')notice='<div class="notice"><strong>Everyone is in.</strong> '+usd(p.total)+' has been released to '+esc(p.recipient)+'. Payment is simulated.</div>';if(p.status==='expired')notice='<div class="notice expired"><strong>Funding deadline missed.</strong> The recipient receives $0. '+(p.members.some(m=>m.refund==='pending')?'Refunds have been initiated. Complete settlement using the demo controls.':'All collected contributions have been returned in the simulation.')+'</div>';
$('#main').innerHTML='<button class="back" onclick="App.home()">← All group pools</button><div class="heading"><div><p class="eyebrow" style="margin-bottom:10px">'+p.id+' · Conditional group payment</p><h1>'+esc(p.title)+'</h1><p class="subtitle">One shared goal. No one left covering the difference.</p></div>'+pill(p)+'</div>'+notice+'<div class="grid"><div><section class="card card-pad"><div class="card-title"><div class="pool-header"><div class="pool-icon">◈</div><div><h2>The group’s progress</h2><p class="tiny muted">'+count+' of '+p.members.length+' people have contributed</p></div></div><span class="badge">'+(count?'Terms locked':'Terms set')+'</span></div><div class="pool-money">'+usd(b.collected)+' <span>collected of '+usd(p.total)+'</span></div><div class="progress"><div style="width:'+b.collected/p.total*100+'%"></div></div><div class="progress-row muted"><span>'+usd(Math.max(0,p.total-b.collected))+' remaining</span><span>'+Math.round(b.collected/p.total*100)+'% funded</span></div><div class="divider"></div><h3>People in this pool</h3>'+p.members.map((x,i)=>'<div class="member"><div class="member-name"><div class="avatar" style="background:'+['#e0e8d8','#f1e5d7','#e3e8ed','#ebe2ed','#e7e6d6'][i%5]+'">'+esc(initial(x.name))+'</div><div><strong style="font-size:12px">'+esc(x.name)+'</strong>'+(i===0?'<span class="tiny muted"> · organizer</span>':'')+'</div></div><div class="member-right"><strong>'+usd(x.share)+'</strong><div class="'+(x.paid?'check':'await')+'">'+(x.refund==='completed'?'↩ Refunded':x.refund==='pending'?'↩ Refund pending':x.paid?(p.status==='released'?'✓ Released':'✓ Held'):'Awaiting contribution')+'</div></div></div>').join('')+'<div class="info-strip"><span>⌑</span><span>The organizer cannot withdraw contributions. Funds are held by the <strong>simulated payments partner</strong> until the agreed condition is met.</span></div></section><section class="card card-pad spacer"><div class="card-title"><h2>Activity & receipts</h2><button class="btn small ghost" onclick="App.exportReceipt()">↓ Export</button></div><div class="events">'+[...p.events].reverse().map(e=>'<div class="event"><span class="event-dot"></span><div><p>'+esc(e.text)+'</p><small>'+date(e.at)+'</small></div>'+(e.amount?'<span class="event-amount">'+usd(e.amount)+'</span>':'')+'</div>').join('')+'</div></section></div><div><section class="card card-pad side-card"><div class="card-title"><h2>Your contribution</h2><span class="badge">Demo user</span></div><label class="label" for="member-select">Act as a participant</label><select id="member-select" onchange="App.selectMember(this.value)">'+p.members.map((x,i)=>'<option value="'+i+'" '+(i===activeMember?'selected':'')+'>'+esc(x.name)+(i===0?' · organizer':'')+'</option>').join('')+'</select><div style="margin:20px 0"><p class="tiny muted">'+esc(m.name)+'’s share</p><div class="pool-money" style="margin-top:1px">'+usd(m.share)+'</div></div><button class="btn primary full" onclick="App.contribute()" '+(m.paid||p.status!=='collecting'?'disabled':'')+'>'+(m.paid?'✓ Contribution recorded':p.status!=='collecting'?'Pool closed':'Contribute '+usd(m.share)+' →')+'</button><p class="tiny muted action-space">Simulated payment. No bank details or cards needed.</p></section><section class="card card-pad side-card"><h2 style="margin-bottom:12px">The agreement</h2><div class="fact"><span>Recipient</span><span>'+esc(p.recipient)+'</span></div><div class="fact"><span>Required total</span><span>'+usd(p.total)+'</span></div><div class="fact"><span>Deadline</span><span>'+date(p.deadline)+'</span></div><div class="fact"><span>Release rule</span><span>Every required share paid</span></div><div class="fact"><span>If incomplete</span><span>Full contribution refunded</span></div><div class="fact"><span>Prototype fee</span><span>$0 · pricing untested</span></div><div class="divider" style="margin:15px 0"></div><div class="fact"><span>Currently held</span><span>'+usd(b.held)+'</span></div><div class="fact"><span>Recipient paid</span><span>'+usd(b.released)+'</span></div><div class="fact"><span>Refunds completed</span><span>'+usd(b.refunded)+'</span></div></section><div class="demo-banner"><p><strong>Workshop controls</strong></p><p style="margin:5px 0 12px">These controls simulate time and partner settlement for your live demonstration.</p><button class="btn small full" onclick="App.expire()" '+(p.status!=='collecting'?'disabled':'')+'>Advance past deadline</button><button class="btn small full action-space" onclick="App.settle()" '+(!p.members.some(m=>m.refund==='pending')?'disabled':'')+'>Complete simulated refunds</button><button class="btn small ghost full action-space" onclick="App.restart()">↻ Restart this scenario</button></div></div></div>'+footer();}
function selectMember(i){activeMember=Number(i);renderPool();}
function modal(html){$('#modal-root').innerHTML='<div class="modal-wrap" onclick="if(event.target===this)App.close()"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal">'+html+'</section></div>';document.body.classList.add('modal-open');requestAnimationFrame(()=>$('#modal-root input, #modal-root button')?.focus());}
function close(){document.body.classList.remove('modal-open');$('#modal-root').innerHTML='';if(view==='pool')$('#member-select')?.focus();}
function formError(e){$('#form-error').textContent=e.message||String(e);}
function create(){const d=new Date(Date.now()+86400000*2);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());modal('<h2 id="modal-title">Start something together.</h2><p class="subtitle">Set a shared goal and clear rules before anyone contributes.</p><form onsubmit="App.submitPool(event)"><div class="field"><label class="label" for="f-title">Pool name</label><input id="f-title" maxlength="70" required placeholder="e.g. Spring break house deposit"></div><div class="field"><label class="label" for="f-recipient">Designated recipient</label><input id="f-recipient" maxlength="90" required placeholder="e.g. Pine Lodge · booking deposit"></div><div class="form-row"><div><label class="label" for="f-total">Total amount · USD</label><input id="f-total" type="number" step="0.01" min="1" max="1000000" required placeholder="400.00"></div><div><label class="label" for="f-date">Funding deadline · your time</label><input id="f-date" type="datetime-local" value="'+d.toISOString().slice(0,16)+'" required></div></div><div class="field"><label class="label" for="f-names">Participants · separate with commas</label><input id="f-names" maxlength="350" value="Ethan, Colin, Cody, Nicholas" required><p class="tiny muted" style="margin-top:6px">2–10 people. First person is the organizer. Total is split equally, with any extra cents allocated in order.</p></div><div class="info-strip">Terms are fixed when created. Everyone must contribute their assigned share. Incomplete pools expire with full refunds.</div><p class="error" id="form-error" role="alert"></p><div class="modal-actions"><button type="button" class="btn" onclick="App.close()">Cancel</button><button type="submit" class="btn primary">Create demo pool →</button></div></form>');}
function submitPool(e){e.preventDefault();try{const p=Q.create({title:$('#f-title').value,recipient:$('#f-recipient').value,total:$('#f-total').value,names:$('#f-names').value.split(',').map(n=>n.trim()),deadline:new Date($('#f-date').value).getTime()});if(p.members.some(m=>m.name.length>40))throw Error('Keep participant names under 40 characters.');data.pools.unshift(p);save();close();open(p.id);toast('Pool created. The group’s agreement is ready.');}catch(e){formError(e)}}
function contribute(){sync();const p=pool(),m=p.members[activeMember];if(!p||p.status!=='collecting'||m.paid){render();return;}modal('<p class="eyebrow" style="margin-bottom:12px">Review your commitment</p><h2 id="modal-title">You’re in for '+usd(m.share)+'.</h2><p class="subtitle">'+esc(m.name)+' · '+esc(p.title)+'</p><div class="fact"><span>To</span><span>'+esc(p.recipient)+'</span></div><div class="fact"><span>Held until</span><span>Everyone contributes, or deadline</span></div><div class="fact"><span>Deadline</span><span>'+date(p.deadline)+'</span></div><div class="fact"><span>If not fully funded</span><span>Your '+usd(m.share)+' is refunded</span></div><label class="checkbox"><input type="checkbox" id="consent" onchange="document.querySelector(\'#confirm-pay\').disabled=!this.checked"><span>I accept this recipient, my share, the deadline, and the automatic release/refund rules.</span></label><p class="tiny muted spacer">This simulates collecting money into partner custody. No payment is actually processed.</p><p class="error" id="form-error" role="alert"></p><div class="modal-actions"><button class="btn" onclick="App.close()">Cancel</button><button class="btn primary" id="confirm-pay" disabled onclick="App.confirmPay()">Confirm simulated payment</button></div>');}
function confirmPay(){if(!$('#consent')?.checked)return;try{const p=pool();Q.pay(p,activeMember);save();close();render();toast(p.status==='released'?'Fully funded. Payment automatically released to the recipient.':'Contribution collected and held by the demo partner.');}catch(e){save();close();render();toast(e.message);}}
function expire(){const p=pool();if(p.status!=='collecting')return;const simulatedNow=Math.max(Date.now(),p.deadline+1000);Q.expire(p,simulatedNow);p.events.push({type:'demo_clock',amount:0,at:simulatedNow,text:'Demo clock advanced past deadline. Real deadline was not edited.'});save();render();toast('Deadline simulated. Incomplete pool closed; refunds initiated.');}
function settle(){try{Q.settle(pool(),Math.max(Date.now(),pool().deadline+2000));save();render();toast('All pending refunds completed in the simulation.');}catch(e){toast(e.message)}}
function restart(){modal('<h2 id="modal-title">Restart this scenario?</h2><p class="subtitle">This removes this pool’s demo contributions and activity. Its agreement is recreated with a deadline two days from now.</p><div class="modal-actions"><button class="btn" onclick="App.close()">Keep current state</button><button class="btn primary" onclick="App.confirmRestart()">Restart demo</button></div>');}
function confirmRestart(){const p=pool(),next=Q.create({title:p.title,recipient:p.recipient,total:p.total/100,names:p.members.map(m=>m.name),deadline:Date.now()+86400000*2});next.id=p.id;data.pools[data.pools.findIndex(x=>x.id===p.id)]=next;save();close();activeMember=0;render();toast('Scenario reset. Ready for another demonstration.');}
function exportReceipt(){const p=pool(),b=Q.balances(p),lines=['QUORUM · SIMULATED TRANSACTION RECEIPT','No real money moved. No qualified partner has been integrated.','',p.id+' · '+p.title,'Recipient: '+p.recipient,'Deadline: '+date(p.deadline),'Status: '+label(p),'Required total: '+usd(p.total),'Collected: '+usd(b.collected),'Held: '+usd(b.held),'Released: '+usd(b.released),'Refunded: '+usd(b.refunded),'',...p.members.map(m=>m.name+' | '+usd(m.share)+' | '+(!m.paid?'Unpaid':m.refund==='none'?'Contributed':m.refund==='pending'?'Refund pending':'Refund completed')),'',...p.events.map(e=>date(e.at)+' | '+e.text+(e.amount?' | '+usd(e.amount):''))];const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download=p.id+'-demo-receipt.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Demo receipt downloaded.');}
function renderGuide(){$('#main').innerHTML='<div class="heading"><div><p class="eyebrow" style="margin-bottom:10px">Prototype workshop</p><h1>Show the promise working.</h1><p class="subtitle">Two outcomes. One agreement. A live demonstration you can repeat.</p></div><button class="btn primary" onclick="App.home()">Open group pools →</button></div><div class="grid"><section class="card card-pad"><h2>Your live demo</h2><div class="steps"><div class="step"><div><h3>Create the agreement</h3><p>Start a pool with a recipient, target amount, participant names, and deadline. A $400 booking split four ways works well. Terms cannot be changed in this version.</p></div></div><div class="step"><div><h3>Collect each contribution</h3><p>Use “Act as a participant” to switch users. Review and accept the agreement for each contribution. Watch the held balance and activity update.</p></div></div><div class="step"><div><h3>Show automatic release</h3><p>The last required contribution triggers a single simulated payment to the designated recipient. There is no organizer withdrawal button.</p></div></div><div class="step"><div><h3>Show the incomplete outcome</h3><p>Restart the scenario. Pay as only three participants. Advance past the deadline. Refunds are initiated automatically; complete simulated refunds to show settlement separately.</p></div></div><div class="step"><div><h3>Verify the record</h3><p>Refresh the page to demonstrate persistence. Export a receipt showing who paid, how much is held, and what was released or refunded.</p></div></div></div></section><div><section class="card card-pad side-card"><h2>What is working</h2><p class="muted" style="font-size:12px;margin-top:13px">Pool creation, equal-share calculations, agreement acceptance, contribution rules, automatic outcomes, duplicate-payment prevention, transaction history, receipts, and browser persistence.</p><div class="divider"></div><h2>What is simulated</h2><p class="muted" style="font-size:12px;margin-top:13px">User identity, money collection, qualified partner custody, recipient payout, refund settlement, and the workshop clock. There is no backend or cross-device collaboration.</p></section><section class="card card-pad"><h2>Before Demo Day</h2><p class="muted" style="font-size:12px;margin-top:13px">Validate a distinct customer need against Hands In and Paysquad. Test pricing and unit economics, confirm a feasible partner approach, and collect feedback from actual target users.</p><p class="tiny muted spacer">This prototype demonstrates behavior. It does not establish regulatory eligibility or a production payments partnership.</p></section></div></div>'+footer();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#modal-root .modal')){const focus=[...document.querySelectorAll('#modal-root button:not(:disabled),#modal-root input,#modal-root select')];const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
setInterval(()=>{const before=JSON.stringify(data.pools.map(p=>p.status));sync();if(before!==JSON.stringify(data.pools.map(p=>p.status)))render()},10000);
save();render();return{home,open,guide,selectMember,create,submitPool,close,contribute,confirmPay,expire,settle,restart,confirmRestart,exportReceipt};})();
</script></body></html>
